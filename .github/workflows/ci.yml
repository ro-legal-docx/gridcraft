name: Labelled menu verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labels:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04","macos-15"]'
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      tools: ''
      targets: ''
      env: |
        GRIDCRAFT_BUILD_LABEL=R&D
      command: |
        git fetch --depth 1 origin 9e6751fb3971a708bcb4ad259cb5e731d0833db1
        git switch --detach 9e6751fb3971a708bcb4ad259cb5e731d0833db1
        cargo test -p gridcraft-ui-egui --lib build_config:: --locked
        cargo test -p gridcraft-ui-egui --lib ribbon::title_bar::tests:: --locked
        cargo test -p gridcraft-ui-egui --lib app::tests:: --locked
        cargo test -p gridcraft-ui-egui --lib updates_ui:: --locked
        cargo test -p gridcraft-ui-egui --lib doc_windows:: --locked
        if [ "$RUNNER_OS" = macOS ]; then cargo test -p gridcraft --test mac_menu_appkit --locked; fi
