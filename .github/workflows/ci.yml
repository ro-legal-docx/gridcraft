name: HGD Windows desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest"]'
      targets: x86_64-pc-windows-msvc
      tools: ''
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      free-disk-space: false
      windows-command: |
        python -c "import base64,os;from pathlib import Path;p=Path(os.environ['RUNNER_TEMP'])/'hgd-build.py';p.write_bytes(base64.b64decode(''))"
        python "$RUNNER_TEMP/hgd-build.py" gridcraft 0.15.0-hgd.1 71e1256b57f3ce008c809f76106947f345a01e19
