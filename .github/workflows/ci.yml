name: Regional format preview verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04"]'
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      tools: ''
      targets: ''
      env: |
        WGPU_BACKEND=vulkan
      command: |
        git fetch --depth 1 origin 6b60ae6ce20187ba6d981c51ae950568aa326712
        git diff --exit-code 6b60ae6ce20187ba6d981c51ae950568aa326712 HEAD -- . ':(exclude).github/workflows/ci.yml'
        mkdir -p target/regional-preview
        cargo run --locked -p gridcraft-ui-egui --example snapshot -- --locale ro-RO --language en --size 1200x800 --scale 1.5 --cmd 'range.setValues={"range":"A1","values":[[1169.5]]}' --cmd 'home.formatCells={"range":"A1","style":{"num_fmt":"#,##0.00"}}' --cmd 'selection.set={"cell":"A1"}' --dialog 'formatCells={}' target/regional-preview/number.png
        cargo run --locked -p gridcraft-ui-egui --example snapshot -- --locale ro-RO --language en --size 1200x800 --scale 1.5 --cmd 'range.setValues={"range":"A1","values":[[45292.625]]}' --cmd 'home.numberFormat={"range":"A1","format":"Short Date"}' --cmd 'selection.set={"cell":"A1"}' --dialog 'formatCells={}' target/regional-preview/date.png
        python3 - <<'PYPNG'
        import base64, pathlib
        for name in ["number", "date"]:
            data = pathlib.Path("target/regional-preview/" + name + ".png").read_bytes()
            encoded = base64.b64encode(data).decode("ascii")
            print("REGIONAL_PREVIEW_BEGIN " + name)
            for offset in range(0, len(encoded), 120):
                print(encoded[offset:offset+120])
            print("REGIONAL_PREVIEW_END " + name)
        PYPNG
