name: Native Windows handle verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      packages: ""
      os: '["windows-2022"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 45
      command: |
        test "$(git rev-parse HEAD^)" = "624da5464987e331b5d87e0e7d4d9da05c785970"
        test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ci.yml"
        git diff --exit-code HEAD^ HEAD -- crates apps Cargo.toml Cargo.lock
        cargo test -p gridcraft-engine --lib file_access::tests
        cargo test -p gridcraft-engine --lib stale_temporary_file_does_not_block_save
        cargo test -p gridcraft-engine --lib simultaneous_atomic_saves
        cargo test -p gridcraft-mcp --lib folder_confinement
        cargo test -p gridcraft-cli --bin gridcraft-cli mcp_root_arguments_
        cargo clippy -p gridcraft-engine -p gridcraft-mcp --all-targets -- -D warnings
